services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: roamly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_USER: roamly_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      POSTGRES_DB: roamly_test
    ports:
      - "127.0.0.1:5433:5432"

  seaweedfs:
    image: chrislusf/seaweedfs:4.43_full
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: roamly
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:23646:23646"
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data:
