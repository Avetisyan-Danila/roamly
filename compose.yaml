services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: roamly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: roamly
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_USER: roamly_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST}
      POSTGRES_DB: roamly_test
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  postgres_data:
